# dsh-reef bundle patch — 浏览器自动化 + MCP Server + GitHub 集成。
#
# 三条插件行:每一行都可以通过行内 config 或用户 profile 的 cordis.patch.yml
# 覆盖调整。不需要某个模块时,在用户的 cordis.patch.yml 里删除对应行即可。
#
# 行内 config 键:
#   reef-browser:  channel('auto'|'chrome'|'msedge'|'chromium'|'') headless screenshotDir downloadDir
#                  screenshotMaxAgeDays screenshotMaxCount liveViewPath maxTextChars
#   reef-mcp:      path authTokenEnv runAgentTimeoutMs listSessionsLimit
#   reef-github:   tokenEnv apiBase webhookPath webhookSecretEnv reviewModel({provider,model})

- insert:
    - id: reef-browser
      name: dsh-reef/browser
      config:
        channel: auto
        headless: true
        screenshotDir: .dsh-reef/screenshots
        screenshotMaxAgeDays: 7
        screenshotMaxCount: 200
        liveViewPath: /reef/browser
        maxTextChars: 20000
        maxLinks: 50
        timeoutMs: 30000

    - id: reef-mcp
      name: dsh-reef/mcp
      config:
        path: /reef/mcp
        authTokenEnv: ""
        runAgentTimeoutMs: 300000
        runAgentMaxOutputChars: 120000
        listSessionsLimit: 50

    - id: reef-github
      name: dsh-reef/github
      config:
        tokenEnv: GITHUB_TOKEN
        apiBase: https://api.github.com
        webhookPath: /reef/github/webhook
        webhookSecretEnv: GITHUB_WEBHOOK_SECRET
        reviewModel: {}
        reviewMaxDiffChars: 60000
        autoReviewEvents:
          - opened
          - synchronize
          - reopened

    - id: reef-console
      name: dsh-reef/console
      config: {}

    - id: reef-gitlab
      name: dsh-reef/gitlab
      config:
        tokenEnv: GITLAB_TOKEN
        apiBase: https://gitlab.com/api/v4
